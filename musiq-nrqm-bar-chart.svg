<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="720" height="420" viewBox="0 0 720 420"
     role="img" aria-labelledby="title desc">
  <title id="title">MUSIQ and NRQM grouped bar chart</title>
  <desc id="desc">Dual-axis grouped bar chart comparing LEDNet, VQCNIR, DarkIR, VIVNet, and Ours. MUSIQ uses the left axis from zero to sixty; NRQM uses the right axis from zero to eight.</desc>
  <metadata>
    Data:
    LEDNet: MUSIQ 39.11, NRQM 5.643
    VQCNIR: MUSIQ 51.04, NRQM 7.064
    DarkIR: MUSIQ 48.79, NRQM 5.051
    VIVNet: MUSIQ 47.76, NRQM 4.918
    Ours: MUSIQ 52.39, NRQM 7.444
  </metadata>

  <g id="background" inkscape:groupmode="layer" inkscape:label="Background">
    <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  </g>

  <g id="grid" inkscape:groupmode="layer" inkscape:label="Grid"
     fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3">
    <line id="grid-60-8" x1="60" y1="46" x2="654" y2="46"/>
    <line id="grid-45-6" x1="60" y1="120.5" x2="654" y2="120.5"/>
    <line id="grid-30-4" x1="60" y1="195" x2="654" y2="195"/>
    <line id="grid-15-2" x1="60" y1="269.5" x2="654" y2="269.5"/>
    <line id="grid-0-0" x1="60" y1="344" x2="654" y2="344"/>
  </g>

  <g id="axes" inkscape:groupmode="layer" inkscape:label="Axes"
     fill="none" stroke="#8b8b8b" stroke-width="1">
    <line id="axis-left" x1="60" y1="46" x2="60" y2="344"/>
    <line id="axis-right" x1="654" y1="46" x2="654" y2="344"/>
    <line id="axis-bottom" x1="60" y1="344" x2="654" y2="344"/>

    <g id="left-tick-marks">
      <line x1="56" y1="46" x2="60" y2="46"/><line x1="56" y1="120.5" x2="60" y2="120.5"/>
      <line x1="56" y1="195" x2="60" y2="195"/><line x1="56" y1="269.5" x2="60" y2="269.5"/>
      <line x1="56" y1="344" x2="60" y2="344"/>
    </g>
    <g id="right-tick-marks">
      <line x1="654" y1="46" x2="658" y2="46"/><line x1="654" y1="120.5" x2="658" y2="120.5"/>
      <line x1="654" y1="195" x2="658" y2="195"/><line x1="654" y1="269.5" x2="658" y2="269.5"/>
      <line x1="654" y1="344" x2="658" y2="344"/>
    </g>
  </g>

  <g id="musiq-bars" inkscape:groupmode="layer" inkscape:label="MUSIQ bars" fill="#7fa6a6">
    <rect id="musiq-lednet" x="82.90" y="149.75" width="34" height="194.25" data-value="39.11"/>
    <rect id="musiq-vqcnir" x="201.70" y="90.50" width="34" height="253.50" data-value="51.04"/>
    <rect id="musiq-darkir" x="320.50" y="101.68" width="34" height="242.32" data-value="48.79"/>
    <rect id="musiq-vivnet" x="439.30" y="106.79" width="34" height="237.21" data-value="47.76"/>
    <rect id="musiq-ours" x="558.10" y="83.80" width="34" height="260.20" data-value="52.39"/>
  </g>

  <g id="nrqm-bars" inkscape:groupmode="layer" inkscape:label="NRQM bars" fill="#de746f">
    <rect id="nrqm-lednet" x="121.90" y="133.80" width="34" height="210.20" data-value="5.643"/>
    <rect id="nrqm-vqcnir" x="240.70" y="80.87" width="34" height="263.13" data-value="7.064"/>
    <rect id="nrqm-darkir" x="359.50" y="155.85" width="34" height="188.15" data-value="5.051"/>
    <rect id="nrqm-vivnet" x="478.30" y="160.80" width="34" height="183.20" data-value="4.918"/>
    <rect id="nrqm-ours" x="597.10" y="66.71" width="34" height="277.29" data-value="7.444"/>
  </g>

  <g id="left-axis-labels" inkscape:groupmode="layer" inkscape:label="Left axis labels"
     fill="#668f90" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400">
    <text x="52" y="46" text-anchor="end" dominant-baseline="middle">60</text>
    <text x="52" y="120.5" text-anchor="end" dominant-baseline="middle">45</text>
    <text x="52" y="195" text-anchor="end" dominant-baseline="middle">30</text>
    <text x="52" y="269.5" text-anchor="end" dominant-baseline="middle">15</text>
    <text x="52" y="344" text-anchor="end" dominant-baseline="middle">0</text>
    <text id="left-axis-name" x="60" y="29" text-anchor="start" font-weight="500">MUSIQ</text>
  </g>

  <g id="right-axis-labels" inkscape:groupmode="layer" inkscape:label="Right axis labels"
     fill="#de746f" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400">
    <text x="662" y="46" text-anchor="start" dominant-baseline="middle">8</text>
    <text x="662" y="120.5" text-anchor="start" dominant-baseline="middle">6</text>
    <text x="662" y="195" text-anchor="start" dominant-baseline="middle">4</text>
    <text x="662" y="269.5" text-anchor="start" dominant-baseline="middle">2</text>
    <text x="662" y="344" text-anchor="start" dominant-baseline="middle">0</text>
    <text id="right-axis-name" x="654" y="29" text-anchor="end" font-weight="500">NRQM</text>
  </g>

  <g id="method-labels" inkscape:groupmode="layer" inkscape:label="Method labels"
     fill="#374151" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400">
    <text id="label-lednet" x="119.40" y="368" text-anchor="end" transform="rotate(-18 119.40 368)">LEDNet</text>
    <text id="label-vqcnir" x="238.20" y="368" text-anchor="end" transform="rotate(-18 238.20 368)">VQCNIR</text>
    <text id="label-darkir" x="357.00" y="368" text-anchor="end" transform="rotate(-18 357.00 368)">DarkIR</text>
    <text id="label-vivnet" x="475.80" y="368" text-anchor="end" transform="rotate(-18 475.80 368)">VIVNet</text>
    <text id="label-ours" x="594.60" y="368" text-anchor="end" transform="rotate(-18 594.60 368)" font-weight="500">Ours</text>
  </g>

  <g id="legend" inkscape:groupmode="layer" inkscape:label="Legend">
    <rect id="legend-background" x="492" y="10" width="154" height="55" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <g id="legend-musiq" transform="translate(504 29)" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#374151">
      <rect x="0" y="-7" width="28" height="12" fill="#7fa6a6"/>
      <text x="36" y="0" dominant-baseline="middle">MUSIQ</text>
    </g>
    <g id="legend-nrqm" transform="translate(504 51)" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#374151">
      <rect x="0" y="-7" width="28" height="12" fill="#de746f"/>
      <text x="36" y="0" dominant-baseline="middle">NRQM</text>
    </g>
  </g>
</svg>
